<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Login - PAWPATROL</title>
    <link rel="stylesheet" href="style.css">
    <script defer src="local-auth.js"></script>
</head>

<body class="login-page">
    <main class="login-card">
        <div class="logo-circle">🐶</div>
        <h1>PAWPATROL</h1>
        <p class="login-subtitle" id="loginSubtitle">Employee sign in</p>

        <form id="loginForm">
            <label for="loginEmail">Email</label>
            <input id="loginEmail" type="email" autocomplete="username" required>

            <label for="loginPassword">Password</label>
            <input id="loginPassword" type="password" autocomplete="current-password" minlength="8" required>

            <p class="login-help" id="passwordHelp" hidden>Use at least 8 characters for your password.</p>
            <p id="loginMessage" class="login-message" role="alert" aria-live="polite"></p>

            <button id="loginButton" class="save-button login-submit" type="submit">Sign in</button>
        </form>

        <button id="modeButton" class="login-mode-button" type="button">Create an account</button>
        <p class="login-notice">This simple account is saved only in this browser. It is for demos, not sensitive or shared business data.</p>
    </main>
</body>

</html>
